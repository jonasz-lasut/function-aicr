apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: clusterstacks.example.org
spec:
  group: example.org
  names:
    kind: ClusterStack
    plural: clusterstacks
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - aicr
            properties:
              aicr:
                description: >-
                  Merged over the function-aicr Input by its overlayFrom. The
                  fields declared here are the ones a ClusterStack may set.
                type: object
                required:
                - criteria
                properties:
                  criteria:
                    type: object
                    properties:
                      accelerator:
                        type: string
                      service:
                        type: string
                      intent:
                        type: string
                      os:
                        type: string
                      platform:
                        type: string
                  profile:
                    type: object
                    additionalProperties:
                      type: string
                  nodeScheduling:
                    type: object
                    properties:
                      system:
                        type: object
                        properties:
                          nodeSelector:
                            type: object
                            additionalProperties:
                              type: string
                          tolerations:
                            type: array
                            items:
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
                            x-kubernetes-list-type: atomic
                      accelerated:
                        type: object
                        properties:
                          nodeSelector:
                            type: object
                            additionalProperties:
                              type: string
                          tolerations:
                            type: array
                            items:
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
                            x-kubernetes-list-type: atomic
                  configuration:
                    type: object
                    properties:
                      gke:
                        type: object
                        properties:
                          tcpxoInterfaces:
                            type: array
                            items:
                              type: object
                              required:
                              - interfaceName
                              - network
                              properties:
                                interfaceName:
                                  type: string
                                network:
                                  type: string
                            x-kubernetes-list-type: atomic
                      runtimeInventory:
                        type: object
                        properties:
                          mode:
                            type: string
          status:
            type: object
            properties:
              aicr:
                type: object
                properties:
                  recipeName:
                    type: string
                  recipeVersion:
                    type: string
                  recipeSource:
                    type: string
                  profile:
                    type: string
                  appliedOverlays:
                    type: array
                    items:
                      type: string
                    x-kubernetes-list-type: atomic
                  componentCount:
                    type: integer
                  deployedComponents:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      properties:
                        name:
                          type: string
                        version:
                          type: string
                        namespace:
                          type: string
                    x-kubernetes-list-type: map
                    x-kubernetes-list-map-keys:
                    - name
                  pendingComponents:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      properties:
                        name:
                          type: string
                        waitingFor:
                          type: string
                    x-kubernetes-list-type: map
                    x-kubernetes-list-map-keys:
                    - name
