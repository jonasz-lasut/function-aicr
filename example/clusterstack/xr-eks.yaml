# An EKS stack: besides Releases, this recipe has manifest files. The
# manifest-only nodewright-customizations component renders its NodeWright
# tuning resource into a provider-kubernetes Object, so rendering it needs
# both schemas under schemas/.
apiVersion: example.org/v1alpha1
kind: ClusterStack
metadata:
  name: gpu-training-stack-eks
  namespace: default
spec:
  aicr:
    criteria:
      accelerator: h100
      service: eks
      intent: training
