---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: inputs.aicr.fn.crossplane.io
spec:
  group: aicr.fn.crossplane.io
  names:
    categories:
    - crossplane
    kind: Input
    listKind: InputList
    plural: inputs
    singular: input
  scope: Namespaced
  versions:
  - name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          Input configures how function-aicr resolves an NVIDIA AICR recipe and
          expands it into composed provider-helm Releases and provider-kubernetes
          Objects.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          componentClasses:
            description: |-
              ComponentClasses limits the recipe to the components of the named AICR
              classes: core is what a plain GPU pod needs to run, ops is everything
              else. Unset, every class is deployed. A component of another class that
              a deployed one depends on counts as satisfied for ordering.
            items:
              type: string
            type: array
            x-kubernetes-list-type: set
          componentOverrides:
            additionalProperties:
              description: A ComponentOverride customizes one resolved recipe component.
              properties:
                namespace:
                  type: string
                values:
                  description: Values are deep-merged over the values the recipe resolved.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                version:
                  type: string
              type: object
            description: ComponentOverrides customize resolved components, keyed by
              component name.
            type: object
          configuration:
            description: |-
              Configuration holds choices that shape the resolved recipe without
              selecting it. It mirrors AICR's own recipe configuration.
            properties:
              gke:
                description: GKE holds choices that only GKE recipes take.
                properties:
                  tcpxoInterfaces:
                    description: |-
                      TCPXOInterfaces maps the guest interfaces eth1 to eth8 to the cluster's
                      GKE Network objects. A recipe that includes the torch-distributed-tcpxo
                      runtime requires it; AICR rejects it on any other recipe.
                    items:
                      description: A NetworkInterfaceMapping binds a guest interface
                        to a GKE Network object.
                      properties:
                        interfaceName:
                          type: string
                        network:
                          type: string
                      required:
                      - interfaceName
                      - network
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              runtimeInventory:
                description: |-
                  RuntimeInventory selects whether the recipe includes AICR's runtime AI
                  workload inventory component, k8s-aibom.
                properties:
                  mode:
                    description: |-
                      Mode is enabled or disabled. Enabled keeps k8s-aibom where the recipe
                      includes it and adds it to any other GKE recipe; disabled removes it.
                    type: string
                required:
                - mode
                type: object
            type: object
          criteria:
            description: |-
              Criteria are the AICR recipe criteria. At least one dimension must be
              set, here or by the overlay.
            properties:
              accelerator:
                type: string
              intent:
                type: string
              os:
                type: string
              platform:
                type: string
              service:
                type: string
            type: object
          draEviction:
            description: |-
              DRAEviction wires AICR's DRA eviction contract, so the GPU Operator can
              evict the DRA kubelet plugin ahead of an in-place GPU driver upgrade:
              dra-node-labeler is enabled and labels every GPU node, the plugin is
              scheduled on that label, and the GPU Operator is told its key. It needs
              gpu-operator, nvidia-dra-driver-gpu and dra-node-labeler in the recipe.
            type: boolean
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          nodeScheduling:
            description: |-
              NodeScheduling places the recipe's components on the cluster's node
              pools. AICR's registry names, per component, the chart values that take
              a node selector or tolerations for system workloads and for workloads
              on accelerated nodes; what is set here is written to those values.
            properties:
              accelerated:
                description: |-
                  Accelerated places the workloads that run on accelerated nodes: device
                  plugins, drivers, exporters.
                properties:
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: |-
                      NodeSelector replaces the node selector of every chart value AICR's
                      registry names for this kind of workload. A component whose registry
                      entry requires a selector is refused without one.
                    type: object
                  tolerations:
                    description: |-
                      Tolerations replace the tolerations of those chart values, and are
                      appended where the recipe sets tolerations of its own. A recipe that
                      sets an empty list keeps the chart's.
                    items:
                      description: |-
                        The pod this Toleration is attached to tolerates any taint that matches
                        the triple <key,value,effect> using the matching operator <operator>.
                      properties:
                        effect:
                          description: |-
                            Effect indicates the taint effect to match. Empty means match all taint effects.
                            When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                          type: string
                        key:
                          description: |-
                            Key is the taint key that the toleration applies to. Empty means match all taint keys.
                            If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                          type: string
                        operator:
                          description: |-
                            Operator represents a key's relationship to the value.
                            Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                            Exists is equivalent to wildcard for value, so that a pod can
                            tolerate all taints of a particular category.
                            Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                          type: string
                        tolerationSeconds:
                          description: |-
                            TolerationSeconds represents the period of time the toleration (which must be
                            of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                            it is not set, which means tolerate the taint forever (do not evict). Zero and
                            negative values will be treated as 0 (evict immediately) by the system.
                          format: int64
                          type: integer
                        value:
                          description: |-
                            Value is the taint value the toleration matches to.
                            If the operator is Exists, the value should be empty, otherwise just a regular string.
                          type: string
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              system:
                description: |-
                  System places the workloads that need no accelerator: operators,
                  controllers, webhooks.
                properties:
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: |-
                      NodeSelector replaces the node selector of every chart value AICR's
                      registry names for this kind of workload. A component whose registry
                      entry requires a selector is refused without one.
                    type: object
                  tolerations:
                    description: |-
                      Tolerations replace the tolerations of those chart values, and are
                      appended where the recipe sets tolerations of its own. A recipe that
                      sets an empty list keeps the chart's.
                    items:
                      description: |-
                        The pod this Toleration is attached to tolerates any taint that matches
                        the triple <key,value,effect> using the matching operator <operator>.
                      properties:
                        effect:
                          description: |-
                            Effect indicates the taint effect to match. Empty means match all taint effects.
                            When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                          type: string
                        key:
                          description: |-
                            Key is the taint key that the toleration applies to. Empty means match all taint keys.
                            If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                          type: string
                        operator:
                          description: |-
                            Operator represents a key's relationship to the value.
                            Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                            Exists is equivalent to wildcard for value, so that a pod can
                            tolerate all taints of a particular category.
                            Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                          type: string
                        tolerationSeconds:
                          description: |-
                            TolerationSeconds represents the period of time the toleration (which must be
                            of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                            it is not set, which means tolerate the taint forever (do not evict). Zero and
                            negative values will be treated as 0 (evict immediately) by the system.
                          format: int64
                          type: integer
                        value:
                          description: |-
                            Value is the taint value the toleration matches to.
                            If the operator is Exists, the value should be empty, otherwise just a regular string.
                          type: string
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
            type: object
          overlayFrom:
            description: |-
              OverlayFrom names an object on the observed composite resource that is
              merged over this Input, so one Composition can serve composite resources
              that each name their own recipe and target cluster. Every other field
              of this Input is static: the value every composite resource gets unless
              its overlay sets the field.
            properties:
              fieldPath:
                description: |-
                  FieldPath names an object on the observed composite resource, shaped
                  like this Input. Its maps are merged over the Input key by key and its
                  lists replace the Input's; an empty string counts as unset. It may set
                  any field but overlayFrom. A path that is absent from the composite
                  resource leaves the Input as it is.
                type: string
            required:
            - fieldPath
            type: object
          profile:
            additionalProperties:
              type: string
            description: |-
              Profile selects a variant of the recipe, keyed by profile name, for
              example {gpuStack: dra}. AICR accepts one selection per recipe and
              rejects one on a recipe that declares no profile; unset, the recipe's
              default variant is deployed.
            maxProperties: 1
            type: object
          providerConfigRef:
            description: |-
              ProviderConfigRef references the provider config holding credentials for
              the target cluster. It is stamped onto every composed Release and Object.
              A name is required, here or from the overlay.
            properties:
              kind:
                default: ClusterProviderConfig
                enum:
                - ClusterProviderConfig
                - ProviderConfig
                type: string
              name:
                type: string
            type: object
          skipComponents:
            description: SkipComponents are excluded from the resolved recipe.
            items:
              description: A ComponentRef names an AICR recipe component.
              properties:
                name:
                  type: string
              required:
              - name
              type: object
            type: array
          skipDeploymentOrder:
            description: |-
              SkipDeploymentOrder deploys every component at once rather than
              withholding a component until its dependencies report Ready.
            type: boolean
          target:
            description: |-
              Target names where on the desired composite resource the resolved-recipe
              summary is written. When unset no status is written.
            properties:
              fieldPath:
                description: |-
                  FieldPath names the object on the composite resource that receives the
                  summary keys (recipeName, recipeVersion, recipeSource, profile,
                  appliedOverlays, componentCount, deployedComponents,
                  pendingComponents). It must begin with "status". Keys already present
                  at the path are preserved; the summary keys are set alongside them.
                pattern: ^status(\..+)?$
                type: string
            required:
            - fieldPath
            type: object
        type: object
    served: true
    storage: true
