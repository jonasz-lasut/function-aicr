<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Liquid gradient using NVIDIA green (#76B900) -->
    <linearGradient id="liquidGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9EE000" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5C8C00" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glass gradient for flask body -->
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76B900" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#76B900" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#76B900" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Soft glow filter for the liquid -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip path so liquid stays inside the flask -->
    <clipPath id="flaskClip">
      <path d="
        M 268 90
        L 268 210
        C 268 220, 262 228, 255 240
        L 175 400
        C 150 450, 175 510, 235 520
        C 260 526, 340 526, 365 520
        C 425 510, 450 450, 425 400
        L 345 240
        C 338 228, 332 220, 332 210
        L 332 90
        Z
      "/>
    </clipPath>
  </defs>

  <!-- Flask outline (neck + bulb) -->
  <path d="
    M 268 90
    L 268 210
    C 268 220, 262 228, 255 240
    L 175 400
    C 150 450, 175 510, 235 520
    C 260 526, 340 526, 365 520
    C 425 510, 450 450, 425 400
    L 345 240
    C 338 228, 332 220, 332 210
    L 332 90
    Z
  " fill="url(#glassGradient)" stroke="#76B900" stroke-width="6" stroke-linejoin="round"/>

  <!-- Flask neck rim -->
  <rect x="260" y="70" width="80" height="24" rx="6" fill="none" stroke="#76B900" stroke-width="6"/>

  <!-- Cork stopper -->
  <rect x="268" y="52" width="64" height="24" rx="6" fill="#76B900" opacity="0.85"/>

  <!-- Liquid fill inside flask, clipped to flask shape -->
  <g clip-path="url(#flaskClip)">
    <rect x="150" y="330" width="320" height="200" fill="url(#liquidGradient)" filter="url(#glow)"/>
    <!-- liquid surface wave -->
    <path d="M 150 335 Q 210 320 270 335 T 390 335 T 470 335 L 470 530 L 150 530 Z"
          fill="url(#liquidGradient)"/>
  </g>

  <!-- Bubbles rising through the liquid -->
  <g fill="#C6F000" opacity="0.9">
    <circle cx="270" cy="480" r="6">
      <animate attributeName="cy" values="500;340" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="500" r="4">
      <animate attributeName="cy" values="510;350" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="470" r="5">
      <animate attributeName="cy" values="490;340" dur="3.6s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="3.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="335" cy="480" r="7">
      <animate attributeName="cy" values="500;340" dur="2.9s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.9s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="510" r="3.5">
      <animate attributeName="cy" values="520;350" dur="3.1s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="3.1s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="355" cy="495" r="4.5">
      <animate attributeName="cy" values="515;345" dur="2.7s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.7s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Small static bubbles for texture -->
  <g fill="#C6F000" opacity="0.6">
    <circle cx="255" cy="420" r="3"/>
    <circle cx="380" cy="440" r="4"/>
    <circle cx="205" cy="460" r="2.5"/>
    <circle cx="410" cy="410" r="3"/>
  </g>

  <!-- Glass highlight -->
  <path d="M 250 240 L 200 380 C 190 410 195 440 210 460"
        fill="none" stroke="#E8FF9E" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
</svg>
