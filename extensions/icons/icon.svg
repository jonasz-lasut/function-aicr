<svg width="248" height="248" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Clip path so the liquid stays inside the flask -->
    <clipPath id="flaskClip">
      <path d="
        M 268 90
        L 268 210
        C 268 220, 262 228, 255 240
        L 175 400
        C 150 450, 175 510, 235 520
        C 260 526, 340 526, 365 520
        C 425 510, 450 450, 425 400
        L 345 240
        C 338 228, 332 220, 332 210
        L 332 90
        Z
      "/>
    </clipPath>
  </defs>

  <!-- Flask outline (neck + bulb) -->
  <path d="
    M 268 90
    L 268 210
    C 268 220, 262 228, 255 240
    L 175 400
    C 150 450, 175 510, 235 520
    C 260 526, 340 526, 365 520
    C 425 510, 450 450, 425 400
    L 345 240
    C 338 228, 332 220, 332 210
    L 332 90
    Z
  " fill="none" stroke="#76B900" stroke-width="6" stroke-linejoin="round"/>

  <!-- Flask neck rim -->
  <rect x="260" y="70" width="80" height="24" rx="6" fill="none" stroke="#76B900" stroke-width="6"/>

  <!-- Cork stopper -->
  <rect x="268" y="52" width="64" height="24" rx="6" fill="#76B900"/>

  <!-- Liquid fill inside flask, clipped to flask shape -->
  <g clip-path="url(#flaskClip)">
    <path d="M 150 335 Q 210 320 270 335 T 390 335 T 470 335 L 470 530 L 150 530 Z" fill="#76B900"/>
  </g>

  <!-- Static bubbles for texture -->
  <g fill="#76B900">
    <circle cx="255" cy="420" r="5"/>
    <circle cx="310" cy="460" r="6"/>
    <circle cx="205" cy="460" r="4"/>
    <circle cx="360" cy="410" r="5"/>
  </g>
</svg>
