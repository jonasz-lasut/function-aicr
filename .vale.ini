# Vale, the prose linter over the documentation. The style packages are
# pinned by URL and synced into .vale/styles (gitignored) by `vale sync`;
# only the vocabulary under .vale/styles/config is committed.
# .github/workflows/docs.yml runs it on every pull request that touches the
# documentation, and any alert fails.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Aicr
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.2/Google.zip, \
  https://github.com/errata-ai/Microsoft/releases/download/v0.15.2/Microsoft.zip, \
  https://github.com/errata-ai/proselint/releases/download/v0.3.4/proselint.zip, \
  https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[*.md]
BasedOnStyles = Vale, Google, Microsoft, proselint, write-good, ai-tells
# The project's own choices where the packages disagree with it or with each
# other: no Oxford comma, "will" and Latin abbreviations allowed, the
# impersonal voice checked by review rather than by rule, a short dash with
# spaces instead of either package's dash.
Google.OxfordComma = NO
Google.Will = NO
Google.Latin = NO
Microsoft.We = NO
Microsoft.FirstPerson = NO
Microsoft.Foreign = NO
Microsoft.Quotes = NO
Microsoft.GeneralURL = NO
Google.EmDash = NO
Microsoft.Dashes = NO
# XRD and DRA are the terms readers search for; neither has a spelled-out
# form in use.
Microsoft.HeadingAcronyms = NO

# The passive is a judgment on these pages, made sentence by sentence in
# review: reference and troubleshooting pages name what is refused, kept or
# withheld, where the function is the actor on every line.
[{README.md,example/clusterstack/README.md,docs/**/*.md,docs/*.md}]
write-good.Passive = NO
Google.Passive = NO
Microsoft.Passive = NO
