# The end-to-end suite (test/e2e, the Makefile): a kind cluster with
# Crossplane, the providers, a registry that holds the suite's own charts and
# recipe catalog, and function-aicr built from the tree. It deploys nothing
# from outside the cluster, so it takes a few minutes and runs on every pull
# request and on main.
name: E2E

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          # common.mk derives the package version from the tags.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            test/e2e/go.sum

      - name: Set Up the Cluster
        run: make e2e.up

      - name: Run the Suite
        run: make e2e.test

      - name: Dump the Cluster
        if: failure()
        run: make e2e.dump

      - name: Upload the Dump
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controlplane-dump
          path: _output/controlplane-dump
          if-no-files-found: ignore
