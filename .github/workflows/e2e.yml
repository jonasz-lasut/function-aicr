# The end-to-end suite (test/e2e, the Makefile): a kind cluster with
# Crossplane, the providers and function-aicr built from the tree. It has two
# profiles, each on a cluster of its own.
#
# catalog deploys the suite's own small catalog from a registry in the
# cluster. Beyond the packages and the registry's image it pulls nothing, and
# it runs on every pull request and on main.
#
# kwok deploys a stock recipe, with its real charts, onto nodes that KWOK
# simulates. It pulls every chart of the recipe from its upstream registry, so
# it runs on request: on a pull request that has the `e2e:kwok` label, or from
# the Actions tab.
name: E2E

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      kwok:
        description: Also run the kwok profile
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The profiles this event runs. Any label fires `labeled`: one that is not
  # e2e:kwok selects nothing, and e2e:kwok selects kwok alone, so adding a
  # label never repeats the catalog run the commit already has.
  profiles:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      profiles: ${{ steps.select.outputs.profiles }}
    steps:
      - name: Select the Profiles
        id: select
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELLED_KWOK: ${{ contains(github.event.pull_request.labels.*.name, 'e2e:kwok') }}
          DISPATCHED_KWOK: ${{ inputs.kwok }}
        run: |
          profiles=()
          if [[ "$EVENT" != pull_request ]]; then
            profiles+=(catalog)
            if [[ "$DISPATCHED_KWOK" == true ]]; then profiles+=(kwok); fi
          else
            if [[ "$ACTION" != labeled ]]; then profiles+=(catalog); fi
            if [[ "$LABELLED_KWOK" == true && ( "$ACTION" != labeled || "$LABEL" == "e2e:kwok" ) ]]; then
              profiles+=(kwok)
            fi
          fi
          echo "profiles=$(jq -cn '$ARGS.positional' --args "${profiles[@]}")" >> "$GITHUB_OUTPUT"

  e2e:
    name: e2e (${{ matrix.profile }})
    needs: profiles
    if: needs.profiles.outputs.profiles != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.profiles.outputs.profiles) }}
    # One run per profile and branch, the newest cancelling the one before it
    # on a pull request.
    concurrency:
      group: e2e-${{ matrix.profile }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      E2E_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          # common.mk derives the package version from the tags.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            test/e2e/go.sum

      # The suite is a Go module of its own, which the unit-test and lint
      # jobs do not reach.
      - name: Vet the Suite
        working-directory: test/e2e
        run: |
          go vet ./...
          go mod tidy -diff

      - name: Set Up the Cluster
        run: make e2e.up

      - name: Run the Suite
        run: make e2e.test

      - name: Dump the Cluster
        if: failure()
        run: make e2e.dump

      - name: Upload the Dump
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controlplane-dump-${{ matrix.profile }}
          path: _output/controlplane-dump
          if-no-files-found: ignore
