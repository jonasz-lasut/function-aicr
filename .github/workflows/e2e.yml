# The end-to-end suite (test/e2e, the Makefile): a kind cluster with
# Crossplane, the providers and function-aicr built from the tree. It has two
# profiles, each on a cluster of its own.
#
# catalog deploys the suite's own small catalog from a registry in the
# cluster. Beyond the packages and the registry's image it pulls nothing.
#
# kwok deploys a stock recipe, with its real charts, onto nodes that KWOK
# simulates. It pulls every chart of the recipe from its upstream registry.
#
# The suite runs on request only. On a pull request that is by label:
#
#   e2e          every profile
#   e2e:catalog  the catalog profile
#   e2e:kwok     the kwok profile
#
# Renovate labels its pull requests `e2e`. A manual run from the Actions tab
# runs the catalog profile, and the kwok profile with it on request.
name: E2E

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      kwok:
        description: Also run the kwok profile
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The profiles this event runs. A new commit runs the profiles the pull
  # request's labels select. Adding a label runs what that label selects and
  # nothing else, so a label that is not one of the suite's starts nothing and
  # `e2e:kwok` does not repeat a catalog run the commit already has.
  profiles:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      profiles: ${{ steps.select.outputs.profiles }}
    steps:
      - name: Select the Profiles
        id: select
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DISPATCHED_KWOK: ${{ inputs.kwok }}
        run: |
          profiles_of() {
            case "$1" in
              e2e) echo catalog; echo kwok ;;
              e2e:catalog) echo catalog ;;
              e2e:kwok) echo kwok ;;
            esac
          }
          selected=$(
            if [[ "$EVENT" != pull_request ]]; then
              echo catalog
              if [[ "$DISPATCHED_KWOK" == true ]]; then echo kwok; fi
            elif [[ "$ACTION" == labeled ]]; then
              profiles_of "$ADDED_LABEL"
            else
              jq -r '.[]' <<<"$LABELS" | while read -r label; do profiles_of "$label"; done
            fi
          )
          echo "profiles=$(awk 'NF && !seen[$0]++' <<<"$selected" | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  # No name of its own: GitHub appends the profile, as in `e2e (catalog)`, and
  # a run that selects no profile shows one skipped `e2e`.
  e2e:
    needs: profiles
    if: needs.profiles.outputs.profiles != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.profiles.outputs.profiles) }}
    # One run per profile and branch, the newest cancelling the one before it
    # on a pull request.
    concurrency:
      group: e2e-${{ matrix.profile }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      E2E_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          # common.mk derives the package version from the tags.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            test/e2e/go.sum

      # The suite is a Go module of its own, which the unit-test and lint
      # jobs do not reach.
      - name: Vet the Suite
        working-directory: test/e2e
        run: |
          # Quietly: go names every module it downloads.
          go mod download 2>/dev/null || true
          go vet ./...
          go mod tidy -diff

      - name: Set Up the Cluster
        run: make e2e.up

      - name: Run the Suite
        run: make e2e.test

      - name: Dump the Cluster
        if: failure()
        run: make e2e.dump

      # The job's log has one line per feature and step, and the whole log of
      # a feature that failed. The cluster's state at that point is here.
      - name: Upload the Dump
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controlplane-dump-${{ matrix.profile }}
          path: _output/controlplane-dump
          if-no-files-found: ignore

      - name: Upload the Test Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-tests-${{ matrix.profile }}
          path: _output/e2e/tests-${{ matrix.profile }}.xml
          if-no-files-found: ignore
