apiVersion: example.org/v1
kind: GPUStack
metadata:
  name: cs-gke-kubeflow
  namespace: default
spec:
  aicr:
    criteria:
      accelerator: h100
      service: gke
      intent: training
      os: cos
      platform: kubeflow
    configuration:
      gke:
        tcpxoInterfaces:
        - interfaceName: eth1
          network: cs-gke-gpu-nic-0
        - interfaceName: eth2
          network: cs-gke-gpu-nic-1
        - interfaceName: eth3
          network: cs-gke-gpu-nic-2
        - interfaceName: eth4
          network: cs-gke-gpu-nic-3
        - interfaceName: eth5
          network: cs-gke-gpu-nic-4
        - interfaceName: eth6
          network: cs-gke-gpu-nic-5
        - interfaceName: eth7
          network: cs-gke-gpu-nic-6
        - interfaceName: eth8
          network: cs-gke-gpu-nic-7
