# function-aicr's runtime config in the suite: the image `make e2e.image`
# builds and `kind load` puts on the node, debug logging, the suite's recipe
# catalog as the OCI recipe source, and the registry's CA in the trust store,
# since AICR pulls a recipe source over HTTPS only. `make e2e.catalog`
# substitutes the repository and the digest and applies the config;
# local.xpkg.deploy.function.% installs the Function with it.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: function-aicr-e2e
spec:
  deploymentTemplate:
    spec:
      selector: {}
      strategy: {}
      template:
        spec:
          containers:
          - name: package-runtime
            image: function-aicr-e2e:dev
            imagePullPolicy: IfNotPresent
            args:
            - --debug
            - --recipe-oci-repository=RECIPE_OCI_REPOSITORY
            - --recipe-oci-digest=RECIPE_OCI_DIGEST
            env:
            - name: SSL_CERT_FILE
              value: /etc/function-aicr/registry-ca/ca.crt
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs
            volumeMounts:
            - name: registry-ca
              mountPath: /etc/function-aicr/registry-ca
              readOnly: true
          volumes:
          - name: registry-ca
            configMap:
              name: e2e-registry-ca
