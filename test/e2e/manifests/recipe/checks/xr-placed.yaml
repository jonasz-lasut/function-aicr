# The same composite resource with the selector the check asks for.
apiVersion: e2e.aicr.example.org/v1alpha1
kind: Stack
metadata:
  name: checks
  namespace: default
spec:
  aicr:
    criteria:
      service: kind
      intent: inference
    nodeScheduling:
      accelerated:
        nodeSelector:
          e2e.aicr.example.org/accelerated-pool: ""
