# The components of the end-to-end suite's catalog. AICR merges this registry
# with the embedded one, so the stock components stay defined; none is
# deployed, because overlays/base.yaml replaces the stock base overlay and
# refers only to the components below.
apiVersion: aicr.run/v1beta1
kind: ComponentRegistry
components:
  - name: e2e-first
    displayName: e2e-first
    class: core
    helm:
      defaultRepository: oci://registry.e2e.svc:5443/charts
      defaultChart: e2e-app
      defaultVersion: 0.1.0
      defaultNamespace: e2e-first
    nodeScheduling:
      system:
        nodeSelectorPaths:
          - nodeSelector
        tolerationPaths:
          - tolerations
  - name: e2e-second
    displayName: e2e-second
    class: core
    helm:
      defaultRepository: oci://registry.e2e.svc:5443/charts
      defaultChart: e2e-app
      defaultVersion: 0.1.0
      defaultNamespace: e2e-second
    nodeScheduling:
      accelerated:
        nodeSelectorPaths:
          - nodeSelector
        tolerationPaths:
          - tolerations
  # Only the inference recipe has this component. Its entry declares one of
  # AICR's own bundle checks, as AICR's registry declares them: AICR refuses
  # to bundle it without a node selector for the accelerated workloads. The
  # check has no conditions, because AICR applies a condition on a criteria
  # dimension to every recipe that leaves the dimension unstated too.
  - name: e2e-checked
    displayName: e2e-checked
    class: core
    helm:
      defaultRepository: oci://registry.e2e.svc:5443/charts
      defaultChart: e2e-app
      defaultVersion: 0.1.0
      defaultNamespace: e2e-checked
    nodeScheduling:
      accelerated:
        nodeSelectorPaths:
          - nodeSelector
    validations:
      - function: CheckAcceleratedSelectorMissing
        severity: error
        message: "The suite's e2e-checked runs on the accelerated pool."
  - name: e2e-notes
    displayName: e2e-notes
    class: ops
    helm:
      defaultRepository: ""
      defaultNamespace: e2e-second
    manifestFiles:
      - components/e2e-notes/manifests/notes.yaml
